<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>团队 · 高端品牌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d10;
            color: #eaeef2;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-wrapper {
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 2.5rem;
            background: radial-gradient(circle at 10% 20%, #13171e, #080a0d);
            min-height: 100vh;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* ===== 导航 ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0 2.5rem 0;
            border-bottom: 1px solid rgba(255, 215, 150, 0.15);
            flex-wrap: wrap;
            gap: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 300;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #f0e6d8;
        }

        .logo i {
            color: #d4a373;
            font-size: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 2.8rem;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: #b9c2ce;
        }

        .nav-links a {
            text-decoration: none;
            color: #b9c2ce;
            transition: color 0.2s;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .nav-links a:hover {
            color: #e6dacb;
            border-bottom-color: #d4a373;
        }

        .nav-links .active {
            color: #f0e6d8;
            border-bottom-color: #d4a373;
        }

        /* ===== 团队主体：跳转卡片 ===== */
        .team-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
            text-align: center;
        }

        .team-main .breadcrumb {
            font-size: 0.8rem;
            color: #8896a8;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
            align-self: flex-start;
        }

        .team-main .breadcrumb i {
            color: #d4a373;
            margin: 0 6px;
        }

        .team-main h1 {
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 300;
            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .team-main h1 strong {
            font-weight: 600;
            background: linear-gradient(135deg, #f3e4d3, #d4a373);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .team-main .sub-text {
            color: #bcc6d4;
            font-weight: 300;
            font-size: 1.1rem;
            max-width: 500px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        /* 跳转大卡片 */
        .jump-card {
            background: rgba(24, 30, 40, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 3rem 3.5rem;
            max-width: 600px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .jump-card:hover {
            transform: translateY(-8px);
            border-color: rgba(212, 163, 115, 0.35);
            background: rgba(32, 40, 52, 0.7);
            box-shadow: 0 30px 50px -12px #00000088;
        }

        .jump-card .icon-wrapper {
            font-size: 4rem;
            color: #d4a373;
            margin-bottom: 1.2rem;
        }

        .jump-card h2 {
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.8rem;
        }

        .jump-card p {
            color: #b0bac9;
            font-weight: 300;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .jump-card .btn-jump {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #d4a373;
            padding: 0.8rem 2.8rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #0b0d10;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(212, 163, 115, 0.25);
        }

        .jump-card .btn-jump:hover {
            background: #e2bc8c;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212, 163, 115, 0.35);
        }

        /* 整个卡片可点击（备用） */
        .jump-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* ===== 页脚 ===== */
        .footer {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 215, 150, 0.07);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #6f7c8e;
        }

        .footer .socials i {
            font-size: 1.2rem;
            margin-left: 1.2rem;
            color: #6f7c8e;
            transition: color 0.2s;
            cursor: default;
        }

        .footer .socials i:hover {
            color: #d4a373;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .site-wrapper {
                padding: 1.5rem 1.5rem;
            }
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
                padding-bottom: 1.8rem;
            }
            .nav-links {
                gap: 1.8rem;
                flex-wrap: wrap;
                font-size: 0.9rem;
            }
            .team-main h1 {
                font-size: 2.6rem;
            }
            .jump-card {
                padding: 2rem 1.8rem;
            }
            .jump-card .icon-wrapper {
                font-size: 3rem;
            }
            .footer {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .footer .socials i {
                margin: 0 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .site-wrapper {
                padding: 1rem 1rem;
            }
            .team-main h1 {
                font-size: 2.2rem;
            }
            .jump-card {
                padding: 1.5rem 1.2rem;
                border-radius: 28px;
            }
            .jump-card .btn-jump {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="site-wrapper">

    <!-- 导航 -->
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-gem"></i>
            <span>SONGJIAHAO</span>
        </div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="services.html">服务</a>
            <a href="cases.html">案例</a>
            <a href="team.html" class="active">团队</a>
            <a href="contact.html">联系</a>
        </div>
    </nav>

    <!-- 团队主体 -->
    <section class="team-main">
        <div class="breadcrumb">
            <i class="fas fa-home"></i> 首页 <i class="fas fa-chevron-right"></i> 团队
        </div>
        <h1>我们的<strong>团队</strong></h1>
        <p class="sub-text">一群以创意为驱动、以专业为信仰的伙伴，点击下方卡片了解我们。</p>

        <!-- ★★★ 跳转卡片：点击整张卡片或按钮均可跳转 ★★★ -->
        <a href="https://cyoz2969.github.io/page" target="_blank" class="jump-card-link">
            <div class="jump-card">
                <div class="icon-wrapper">
                    <i class="fas fa-users"></i>
                </div>
                <h2>探索团队</h2>
                <p>了解我。</p>
                <span class="btn-jump">
                    前往团队页面 <i class="fas fa-arrow-right"></i>
                </span>
            </div>
        </a>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="copy">
            <i class="far fa-copyright"></i> 2026 SONGJIAHAO · 高端品牌
        </div>
        <div class="socials">
            <i class="fab fa-linkedin-in"></i>
            <i class="fab fa-x-twitter"></i>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-youtube"></i>
        </div>
    </footer>

</div>
</body>
</html>
